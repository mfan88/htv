# Run on your home server:   docker compose up -d --build
# Public via Caddy on the host: htv.fenna.tech { reverse_proxy 127.0.0.1:8787 { flush_interval -1 } }
services:
  htv:
    build: .
    container_name: htv-server
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Put HTV_TOKEN=<random string> in .env next to this file (git-ignored).
      HTV_TOKEN: ${HTV_TOKEN:?set HTV_TOKEN in .env}
      HTV_CONCURRENCY: 3      # links checked at once
      HTV_REFRESH_MIN: 5      # minutes between schedule scrapes
      HTV_LOGOS: /logos       # thumbnails folder (the mount below)
    volumes:
      - ${HTV_LOGOS:-./htv-data/logos}:/logos:ro   # AWAY_vs_HOME.png thumbnails (set HTV_LOGOS in .env to use another folder)
      - ./htv-data:/data      # caches (schedule, ad-block filters)
    shm_size: 512m            # Chromium needs more shared memory than Docker's 64 MB default

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>htv</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <div class="brand">
    <span class="logo">htv</span>
    <span class="spacer"></span>
    <button class="chip" id="refresh" title="Re-scrape onhockey.tv (F5)">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      Refresh
    </button>
  </div>
  <div class="status" id="status">Loading…</div>
  <div id="games"></div>
</aside>

<main>
  <div class="top">
    <button class="ctl side-toggle" id="btnSidebar" title="Show/hide streams (S)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <div class="now">
      <h1 id="nowTitle">Pick a stream</h1>
      <span class="sub" id="nowSub"></span>
    </div>
    <section class="stats" id="stats" hidden>
      <div class="scorebug" id="scorebug"></div>
      <ol class="goals" id="goals"></ol>
    </section>
  </div>

  <div class="player" id="player">
    <video id="video" playsinline></video>
    <div id="embedHost"></div>

    <div class="overlay" id="overlay">
      <div class="overlay-box">
        <div class="spinner" id="overlaySpinner" hidden></div>
        <b id="overlayTitle">No stream selected</b>
        <span id="overlayText">Choose a game in the sidebar, then a link.</span>
      </div>
    </div>

    <div class="controls" id="controls" hidden>
      <button class="ctl" id="btnPlay" title="Play/Pause (Space)">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="ctl" id="btnMute" title="Mute (M)">
        <svg class="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="i-muted" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="m17 9 5 6M22 9l-5 6"/></svg>
      </button>
      <input type="range" id="volume" min="0" max="1" step="0.02" value="1" title="Volume (↑/↓)">
      <button class="live" id="btnLive" title="Jump to live">LIVE</button>
      <span class="spacer"></span>
      <select id="quality" title="Quality"></select>
      <button class="ctl" id="btnPip" title="Picture in picture">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="ctl" id="btnFull" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <div class="linkbar" id="linkbar" hidden>
    <span class="mode" id="modeLabel"></span>
    <code id="linkText"></code>
    <button class="chip" id="btnMode"></button>
    <button class="chip ghost" id="btnExternal">Open in browser ↗</button>
  </div>
</main>

<script src="../../node_modules/hls.js/dist/hls.min.js"></script>
<script src="renderer.js"></script>
</body>
</html>

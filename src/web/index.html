<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="htv">
<meta name="theme-color" content="#0b0d12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>htv</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="logo">htv</span>
  <span class="status" id="status">Loading…</span>
  <button class="chip" id="refresh" aria-label="Refresh">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</header>

<section class="player" id="player" hidden>
  <div class="screen">
    <video id="video" playsinline controls x-webkit-airplay="allow" preload="none"></video>
    <button class="overlay" id="overlay" type="button">
      <span class="spinner" id="overlaySpinner" hidden></span>
      <b id="overlayTitle"></b>
      <span id="overlayText"></span>
    </button>
  </div>
  <div class="now">
    <div class="now-text">
      <b id="nowTitle"></b>
      <span id="nowSub"></span>
    </div>
    <button class="ctl airplay" id="btnAirplay" aria-label="AirPlay" hidden>
      <svg viewBox="0 0 24 24"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path d="m12 15 5 6H7z" fill="currentColor"/></svg>
    </button>
    <button class="ctl" id="btnClose" aria-label="Stop">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</section>

<form class="login" id="login" hidden>
  <b>Server token</b>
  <span>Paste the <code>HTV_TOKEN</code> from the server's <code>.env</code>. It's saved on this device.</span>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button class="chip" type="submit">Save</button>
</form>

<main id="games"></main>

<script src="app.js"></script>
</body>
</html>

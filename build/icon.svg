<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc2ff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".58" r=".5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile: 824px artwork on a 1024 canvas (macOS icon grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- Screen outline -->
  <rect x="222" y="300" width="580" height="400" rx="56" fill="none" stroke="#4f8cff" stroke-opacity=".35" stroke-width="14"/>
  <path d="M430 752h164" stroke="#4f8cff" stroke-opacity=".35" stroke-width="14" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="512" y="568" text-anchor="middle"
        font-family="Segoe UI Variable Display, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-weight="800" font-size="236" letter-spacing="-8" fill="url(#word)">htv</text>

  <!-- Live dot -->
  <circle cx="742" cy="360" r="30" fill="#ff4d5e"/>
  <circle cx="742" cy="360" r="46" fill="none" stroke="#ff4d5e" stroke-opacity=".35" stroke-width="10"/>
</svg>

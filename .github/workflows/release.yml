name: Release

# Push a version tag (e.g. `npm version patch && git push --follow-tags`) to build
# Windows, macOS and Linux apps and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      HAS_BUILTIN_SERVER: ${{ secrets.HTV_SERVER_URL != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Import the Developer ID certificate into a fresh keychain ourselves (GitHub's
      # documented approach). electron-builder's own keychain import fails on recent
      # macOS runners; it finds the identity in this keychain instead.
      - name: Import Mac signing certificate
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          echo "Signing identities found:"
          security find-identity -v -p codesigning "$KEYCHAIN" | tee "$RUNNER_TEMP/identities.txt"

          # Notarization only accepts "Developer ID Application" certificates. With any
          # other kind (e.g. "Apple Development"), fall back to an ad-hoc signed build.
          if grep -q '"Developer ID Application:' "$RUNNER_TEMP/identities.txt"; then
            echo "DEVELOPER_ID_OK=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=Mac build not notarized::MAC_CERT_P12_BASE64 is not a 'Developer ID Application' certificate (see the identities above). Building an ad-hoc signed, un-notarized app instead. Create a Developer ID Application certificate (paid Apple Developer Program) and update the secret."
          fi

      # The built-in server the app uses by default. Kept out of the repo, but anyone
      # can read it from the packaged app: it only keeps out random scanners.
      - name: Write built-in server
        if: env.HAS_BUILTIN_SERVER == 'true'
        shell: bash
        env:
          HTV_SERVER_URL: ${{ secrets.HTV_SERVER_URL }}
          HTV_TOKEN: ${{ secrets.HTV_TOKEN }}
        run: |
          node -e 'require("fs").writeFileSync("src/defaults.json", JSON.stringify({ serverUrl: process.env.HTV_SERVER_URL, token: process.env.HTV_TOKEN }))'

      - name: Build and publish
        # bash on every OS: Windows' default PowerShell splits "-c.publish.x=y" at the dot.
        shell: bash
        run: |
          # Secrets that aren't set arrive as empty strings, which electron-builder
          # treats as real values. Drop them.
          for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          extra=()
          if [ "$RUNNER_OS" = "macOS" ] && [ "${DEVELOPER_ID_OK:-}" != "true" ]; then
            # No usable Developer ID: ad-hoc sign (Apple Silicon Macs refuse to run
            # unsigned apps) and skip notarization, which would reject the build.
            extra+=("-c.mac.identity=-")
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder ${{ matrix.target }} --publish always \
            -c.publish.provider=github -c.publish.releaseType=draft "${extra[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only the keychain above is used for signing on the Mac job; never on others.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
          # Notarization (see README).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

name: Release

# Push a version tag (e.g. `npm version patch && git push --follow-tags`) to build
# Windows, macOS and Linux apps and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and publish
        # bash on every OS: Windows' default PowerShell splits "-c.publish.x=y" at the dot.
        shell: bash
        run: |
          # Secrets that aren't set arrive as empty strings, which electron-builder treats
          # as real values (an empty CSC_LINK resolves to the project folder). Drop them.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          extra=()
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then
            # No Developer ID yet: ad-hoc sign, or Apple Silicon Macs refuse to run the app.
            extra+=("-c.mac.identity=-")
          fi
          npx electron-builder ${{ matrix.target }} --publish always \
            -c.publish.provider=github -c.publish.releaseType=draft "${extra[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (only used on the Mac job; see README).
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

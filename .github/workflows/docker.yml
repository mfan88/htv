# Builds the images and publishes them to ghcr.io/<owner>/htv (the server) and ghcr.io/<owner>/htv-byparr
# (the captcha solver htv falls back to, built from a pinned Byparr release) on every push to main and on v* tags.
name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Byparr is built from upstream's own Dockerfile at a pinned tag, so the compose file never depends
  # on someone else's floating :latest. Bump BYPARR_REF to upgrade.
  byparr:
    runs-on: ubuntu-latest
    env:
      BYPARR_REF: v3.1.1
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-byparr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.BYPARR_REF }}
      - uses: docker/build-push-action@v6
        with:
          context: https://github.com/ThePhaseless/Byparr.git#${{ env.BYPARR_REF }}
          build-args: VERSION=${{ env.BYPARR_REF }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=byparr
          cache-to: type=gha,mode=max,scope=byparr
